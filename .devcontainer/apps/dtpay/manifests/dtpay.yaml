# Backend — Java Spring Boot (dtusecase)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dtdemos-usecase
  namespace: dtusecase
  labels:
    app: dtdemos-usecase
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dtdemos-usecase
  template:
    metadata:
      labels:
        app: dtdemos-usecase
    spec:
      containers:
        - name: dtdemos-usecase
          image: domuharahap/dtdemo-usecase:2.3
          ports:
            - containerPort: 8080
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx256m -XX:+ExitOnOutOfMemoryError"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: dtdemos-usecase
  namespace: dtusecase
  labels:
    app: dtdemos-usecase
spec:
  selector:
    app: dtdemos-usecase
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
# Frontend — Nginx reverse proxy + React UI (payment-frontend)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-frontend
  namespace: dtusecase
  labels:
    app: payment-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-frontend
  template:
    metadata:
      labels:
        app: payment-frontend
    spec:
      containers:
        - name: payment-frontend
          image: domuharahap/dtdemo-usecase:payment-frontend.1.0
          ports:
            - containerPort: 80
          env:
            - name: API_BASE_URL
              value: "http://dtdemos-usecase"
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: payment-frontend
  namespace: dtusecase
  labels:
    app: payment-frontend
spec:
  selector:
    app: payment-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
