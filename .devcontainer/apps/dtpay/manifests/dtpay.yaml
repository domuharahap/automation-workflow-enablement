# Backend — Java Spring Boot (dtusecase)
apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: backend-usecase
  name: backend-usecase
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-usecase
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: backend-usecase
    spec:
      containers:
        - image: domuharahap/dtdemo-usecase:backend.4.2
          name: backend-usecase
          resources:
            limits:
              memory: "512Mi"  # Set memory limit
              cpu: "500m" # Set the CPU limit to 500 milliCPU
            requests:
              memory: "256Mi"
              cpu: "250m"
          env:
            - name: JAVA_OPTS
              value: >
                -Xms256m
                -Xmx256m
                -XX:+ExitOnOutOfMemoryError
status: {}

---

apiVersion: v1
kind: Service
metadata:
  creationTimestamp: null
  labels:
    app: backend-usecase
  name: backend-services
spec:
  ports:
    - port: 8080
      protocol: TCP
      targetPort: 8080
  type: ClusterIP
  selector:
    app: backend-usecase
status:
  loadBalancer: {} 
---
#nginx.config
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
data:
  default.conf: |
    server {
        listen 80;
        #resolver 34.118.227.22 valid=30s;

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }
        location /api {
          proxy_pass http://backend-services:8080;

          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        # Error handling
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }

--- 
# Frontend — Nginx reverse proxy + React UI (payment-frontend)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-frontend
  template:
    metadata:
      labels:
        app: payment-frontend
    spec:
      containers:
        - name: frontend
          image: domuharahap/dtdemo-usecase:frontend.4.5
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config-volume
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: config-volume
          configMap:
            name: frontend-nginx-config

---
apiVersion: v1
kind: Service
metadata:
  name: payment-frontend
spec:
  type: ClusterIP
  selector:
    app: payment-frontend
  ports:
    - port: 80
      targetPort: 80
