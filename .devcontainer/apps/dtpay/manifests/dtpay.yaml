# Backend — Java Spring Boot (dtusecase)
apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: backend-usecase
  name: backend-usecase
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-usecase
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: backend-usecase
    spec:
      containers:
        - image: domuharahap/dtdemo-usecase:backend.4.2
          name: backend-usecase
          resources:
            limits:
              memory: "512Mi"  # Set memory limit
              cpu: "500m" # Set the CPU limit to 500 milliCPU
            requests:
              memory: "256Mi"
              cpu: "250m"
          env:
            - name: JAVA_OPTS
              value: >
                -Xms256m
                -Xmx256m
                -XX:+ExitOnOutOfMemoryError
---
apiVersion: v1
kind: Service
metadata:
  creationTimestamp: null
  labels:
    app: backend-usecase
  name: backend-services
spec:
  ports:
    - port: 8080
      protocol: TCP
      targetPort: 8080
  type: ClusterIP
  selector:
    app: backend-usecase  
---
# Frontend — Nginx reverse proxy + React UI (payment-frontend)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-frontend
  namespace: dtusecase
  labels:
    app: payment-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-frontend
  template:
    metadata:
      labels:
        app: payment-frontend
    spec:
      containers:
        - name: payment-frontend
          image: domuharahap/dtdemo-usecase:frontend.4.2
          ports:
            - containerPort: 80
          env:
            - name: API_BASE_URL
              value: "http://backend-services"
          resources:
            requests:
              memory: "128Mi"
              cpu: "128m"
            limits:
              memory: "512Mi"
              cpu: "512m"
---
apiVersion: v1
kind: Service
metadata:
  name: payment-frontend
  namespace: dtusecase
  labels:
    app: payment-frontend
spec:
  selector:
    app: payment-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
