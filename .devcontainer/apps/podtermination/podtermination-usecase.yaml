apiVersion: v1
kind: Pod
metadata:
  name: stuck-pod
spec:
  containers:
  - name: busybox
    image: busybox
    command: ["sh", "-c", "sleep 6000"]
    lifecycle:
      preStop:
        exec:
          # This will now wait for 300 seconds (5 minutes)
          command: ["sh", "-c", "sleep 300"]
  # Set the hard limit to 5 minutes (300 seconds)
  terminationGracePeriodSeconds: 300